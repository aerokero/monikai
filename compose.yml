services:
  monikai:
    build:
      context: .
    image: ghcr.io/aerokero/monikai:latest
    container_name: monikai
    restart: unless-stopped
    init: true
    gpus: all

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    env_file:
      - .env

    environment:
      MONIKAI_HOST: 0.0.0.0
      MONIKAI_PORT: 8000
      WEB_AGENT_HEADLESS: "1"
      SERVER_MIC_WAKE_WORD_REQUIRED: "true"
      SERVER_MIC_WAKE_LISTEN_TIMEOUT_SECONDS: "10"
      # Use the local Kokoro renderer for server-speaker playback.
      # Gemini is retained as an automatic fallback if local synthesis fails.
      SERVER_MIC_TTS_PROVIDER: "local"
      # Kokoro-82M uses the local experimental Polish G2P layer for Polish.
      # Override with SERVER_MIC_TTS_LANGUAGE=auto/en/... when needed.
      SERVER_MIC_TTS_LANGUAGE: "${SERVER_MIC_TTS_LANGUAGE:-pl}"
      SERVER_MIC_TTS_TIMEOUT_SECONDS: "30"
      SERVER_MIC_STT_TIMEOUT_SECONDS: "12"
      # Default path: local wake gate -> STT -> Monika's full conversation/tool stack.
      # Set to "true" only for the lower-latency Gemini Live compatibility mode.
      SERVER_MIC_USE_GEMINI_LIVE: "false"
      SERVER_MIC_FOLLOWUP_TIMEOUT: "8.0"
      SERVER_MIC_GEMINI_LIVE_MODEL: "models/gemini-2.5-flash-native-audio-preview-12-2025"
      SERVER_MIC_LIVE_IDLE_TIMEOUT_SECONDS: "20"
      SERVER_MIC_LIVE_MAX_SESSION_SECONDS: "60"
      SERVER_MIC_VOSK_MODEL_PATH: "/app/data/vosk-model"
      SERVER_MIC_WAKE_CONFIDENCE: "0.72"
      SERVER_MIC_PARTIAL_WAKE_STABILITY_FRAMES: "3"
      # 850 ms ended natural Polish pauses too aggressively.  Keep a modest
      # 1.2 s tail so words at the end of a sentence are not cut off.
      SERVER_MIC_TRAILING_SILENCE_MS: "1200"
      # Safety valve only; normal segments end on trailing silence.
      SERVER_MIC_MAX_SPEECH_MS: "15000"
      SERVER_MIC_PRE_ROLL_MS: "600"
      SERVER_MIC_ENERGY_THRESHOLD_RATIO: "1.8"
      SERVER_MIC_MIN_ENERGY_THRESHOLD: "60"
      SERVER_MIC_MIN_SPEECH_DURATION_MS: "150"
      GEMINI_TRANSCRIBE_MODEL: "gemini-3.5-flash-lite"
      MONIKAI_CONVERSATION_MODEL: "gemini-3.5-flash-lite"
      MONIKAI_CONVERSATION_FALLBACK_MODEL: "gemini-3.6-flash"
      SESSION_SUMMARY_MODEL: "gemini-3.5-flash-lite"
      ODYSSEUS_DATA_DIR: "/app/data/odysseus"
      PYTHONPATH: "/app/data/python-packages:/app:/app/backend/odysseus"
      KOKORO_DEVICE: "auto"
      KOKORO_POLISH_MODE: "${KOKORO_POLISH_MODE:-experimental}"
      HF_HOME: "/app/data/huggingface"

    # Use the LAN resolver so split-DNS names such as ha.tosutosu.pl work
    # from inside the container as well as from the host. Override this when
    # deploying on a different network.
    dns:
      - ${MONIKAI_DNS_SERVER:-192.168.1.10}

    ports:
      - "192.168.1.10:8000:8000"

    devices:
      - /dev/snd:/dev/snd

    group_add:
      - audio

    volumes:
      - /srv/fast/containers/monikai/data:/app/data
      - /srv/fast/containers/monikai/backend:/app/backend:ro
      - /srv/fast/containers/monikai/static:/app/static:ro
      - /srv/fast/containers/monikai/dist:/app/dist:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    stop_grace_period: 30s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: monikai-watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 */10 * * * *"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: "monikai-update-secret"
      WATCHTOWER_HTTP_API_PERIODIC: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8089:8080"
